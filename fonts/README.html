<h1 id="字体文件说明"><a href="#字体文件说明" class="headerlink" title="字体文件说明"></a>字体文件说明</h1><p>本主题使用以下字体：</p>
<ol>
<li><p>Noto Serif SC - Google Fonts</p>
<ul>
<li>用于正文内容</li>
<li>通过 CDN 加载</li>
</ul>
</li>
<li><p>Ma Shan Zheng - Google Fonts</p>
<ul>
<li>用于标题和特殊文字</li>
<li>通过 CDN 加载</li>
</ul>
</li>
<li><p>Font Awesome 6.0.0</p>
<ul>
<li>用于图标</li>
<li>通过 CDN 加载</li>
</ul>
</li>
</ol>
<p>所有字体都通过 CDN 加载，无需本地存储字体文件。 </p>
