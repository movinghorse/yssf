# 特色服务
services:
  - title: 纳西家宴
    icon: fa-utensils
    description: 一天一桌预定饮食，采用本地食材，呈现地道纳西风味。
    
  - title: 品茶听水
    icon: fa-coffee
    description: 在池塘边或亲水平台品茶，听水声、观雪山，享受慢时光。
    
  - title: 古镇漫步
    icon: fa-theater-masks
    description: 束河古镇石板路、四方街、青龙桥，感受千年茶马古道遗韵。
    
  - title: 雪山周边
    icon: fa-mountain
    description: 玉龙雪山、拉市海、白沙壁画，为您规划周边游览路线。

