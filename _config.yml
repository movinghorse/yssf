# 交通指南
transport:
  self_drive:
    title: 自驾
    content: |
      从杭州市区出发，沿灵隐路向西行驶约30分钟即可到达。
      导航地址：浙江省杭州市西湖区云栖路88号
      停车场：免费停车位20个
  train:
    title: 高铁
    content: |
      杭州东站下车，乘坐地铁1号线至龙翔桥站，换乘公交Y2路至云栖竹径站。
      全程约1小时，打车约40分钟。
  bus:
    title: 公交
    content: |
      乘坐公交Y2路、324路至云栖竹径站下车，步行约5分钟即到。
      或乘坐公交103路至灵隐站，转乘Y2路。

